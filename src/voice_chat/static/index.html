<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice Chat</title>
<style>
  :root {
    --bg: #f6f6f4; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66;
    --user: #1d1d1b; --user-text: #ffffff; --bot: #ecece8; --accent: #2f6f4f;
    --border: #dcdcd6; --error: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151514; --panel: #1e1e1c; --text: #ecece8; --muted: #9a9a93;
      --user: #ecece8; --user-text: #151514; --bot: #2a2a27; --accent: #6fbf94;
      --border: #34342f; --error: #f2b8b5;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, sans-serif; height: 100dvh; display: flex; flex-direction: column;
  }
  header, form { padding: 12px 16px; background: var(--panel); border-color: var(--border); }
  header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
  h1 { font-size: 1rem; margin: 0; }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: min(640px, 90%); padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .user { align-self: flex-end; background: var(--user); color: var(--user-text); }
  .bot { align-self: flex-start; background: var(--bot); }
  .bot { border-left: 3px solid transparent; transition: border-color 0.2s; }
  .bot.speaking { border-left-color: var(--accent); }
  .footer { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .footer .meta { margin-top: 0; }
  .replay {
    display: inline-flex; align-items: center; justify-content: center;
    width: 30px; height: 30px; padding: 0; border-radius: 50%;
    background: transparent; color: var(--muted); border: 1px solid var(--border);
  }
  .replay:hover { color: var(--accent); border-color: var(--accent); }
  .replay svg { width: 16px; height: 16px; }
  .speaking .replay { color: var(--accent); border-color: var(--accent); animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.45; } }
  @media (prefers-reduced-motion: reduce) { .speaking .replay { animation: none; } }
  .meta { display: block; margin-top: 6px; font-size: 0.78rem; color: var(--muted); }
  .error { color: var(--error); }
  .loading { color: var(--muted); font-style: italic; }
  form { display: flex; gap: 8px; border-top: 1px solid var(--border); }
  input[type=text] {
    flex: 1; min-width: 0; padding: 10px 12px; font: inherit; color: var(--text);
    background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
  }
  select, button { font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text); }
  button { background: var(--accent); color: #fff; border-color: var(--accent); cursor: pointer; }
  button:disabled { opacity: 0.55; cursor: wait; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<header>
  <h1>Voice Chat</h1>
  <label>Length
    <select id="length">
      <option value="short">Short</option>
      <option value="medium">Medium</option>
      <option value="long">Long</option>
    </select>
  </label>
</header>
<main id="log" aria-live="polite"></main>
<form id="form">
  <input id="input" type="text" placeholder="Type your question" autocomplete="off" maxlength="2000" required>
  <button id="send" type="submit">Send</button>
</form>
<script>
  const sessionId = crypto.randomUUID();
  const log = document.getElementById("log");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const send = document.getElementById("send");
  const lengthSelect = document.getElementById("length");

  function addMessage(kind, text) {
    const el = document.createElement("div");
    el.className = "msg " + kind;
    el.textContent = text;
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
    return el;
  }

  function addMeta(parent, text, isError) {
    const meta = document.createElement("span");
    meta.className = "meta" + (isError ? " error" : "");
    meta.textContent = text;
    parent.appendChild(meta);
  }

  function seconds(ms) { return (ms / 1000).toFixed(1) + "s"; }

  let current = null;

  function stopCurrent() {
    if (!current) return;
    current.audio.pause();
    current.bubble.classList.remove("speaking");
    current = null;
  }

  function speak(audio, bubble) {
    stopCurrent();
    audio.currentTime = 0;
    current = { audio, bubble };
    bubble.classList.add("speaking");
    audio.onended = () => { bubble.classList.remove("speaking"); if (current && current.audio === audio) current = null; };
    audio.play().catch(() => bubble.classList.remove("speaking"));
  }

  function makeReplayButton(audio, bubble) {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "replay";
    button.title = "Replay answer";
    button.setAttribute("aria-label", "Replay answer");
    button.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>';
    button.addEventListener("click", () => speak(audio, bubble));
    return button;
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const message = input.value.trim();
    if (!message) return;

    addMessage("user", message);
    input.value = "";
    send.disabled = true;
    const pending = addMessage("bot loading", "Thinking and preparing the voice…");

    try {
      const response = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: sessionId, message, length: lengthSelect.value }),
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.detail || "Request failed (" + response.status + ")");

      const bubble = addMessage("bot", data.reply);
      pending.remove();
      const footer = document.createElement("div");
      footer.className = "footer";
      bubble.appendChild(footer);
      if (data.audio_b64) {
        const audio = new Audio("data:audio/wav;base64," + data.audio_b64);
        footer.appendChild(makeReplayButton(audio, bubble));
        speak(audio, bubble);
      }
      const voice = data.tts_ms === null ? "voice failed" : "voice " + seconds(data.tts_ms);
      addMeta(footer, "model " + seconds(data.llm_ms) + " · " + voice);
      if (data.tts_error) addMeta(bubble, data.tts_error, true);
    } catch (error) {
      pending.remove();
      addMeta(addMessage("bot", "Something went wrong."), error.message, true);
    } finally {
      send.disabled = false;
      input.focus();
    }
  });
</script>
</body>
</html>
